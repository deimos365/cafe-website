<body>
    <header>
        <div class="neon-box header-logo-0">

                <p>STREET</p>

        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>

            <a href="contact.html" aria-current="page">Contact</a>
        </nav>

    <main>
        <section class="reservation-grid">
            <div class="reservation-box neon-box">
                <h1 class="neon-text-red">RESERVATION FORM</h1>
                <form action="#" method="post">
                    <div class="form-field">
                        <label for="res-name">Name</label>
                        <input type="text" id="res-name" name="name" required>
                    </div>

      <div class="form-row">
        <div class="form-field">
          <label for="res-date">Date</label>
          <input type="date" id="res-date" name="date" required>
        </div>
        <div class="form-field">
          <label for="res-time">Time</label>
          <input type="time" id="res-time" name="time" required>
        </div>
      </div>

      <div class="form-field">
        <label for="res-guests">Number of Guests</label>
        <input type="number" id="res-guests" name="guests" min="1" max="20" value="2" required>
      </div>

      <div class="form-field">
        <label for="res-message">Message</label>
        <textarea id="res-message" name="message" rows="4"></textarea>
      </div>

      <button type="submit" class="btn-submit neon-text-yellow">Submit</button>
    </form>
  </div>

  <div class="find-us-box neon-box">
    <h2 class="neon-text-blue">FIND US</h2>
    <iframe
      class="map-frame"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2504.2402607000313!2d71.42537011230594!3d51.12247617161046!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x42458709e304092b%3A0xf7df87615655c6cc!2sBLA%20BLA%20BAR!5e0!3m2!1sru!2skz!4v1790441679835!5m2!1sru!2skz" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
      width="100%" height="220" style="border:0;" loading="lazy"
      title="Street Food on the map">
    </iframe>
    <ul class="contact-list">
      <li>Phone: <a href="tel:+77112606263">+7 (7112) 60 62 63</a></li>
      <li>Email: <a href="mailto:info@astanait.edu.kz">info@astanait.edu.kz</a></li>
    </ul>
  </div>
</section>
    </main>
